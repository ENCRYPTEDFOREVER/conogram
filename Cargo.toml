[package]
name = "conogram"
description = "An async wrapper for Telegram Bot API"
version = "0.2.29"
edition = "2024"
license = "MIT"
homepage = "https://github.com/ENCRYPTEDFOREVER/conogram"
repository = "https://github.com/ENCRYPTEDFOREVER/conogram"
readme = "readme.md"
categories = ["api-bindings", "asynchronous"]
keywords = ["telegram", "bot", "telegram-bot", "telegram-bot-api"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
conogram-derives = { path = "./derives", version = "0.1.2" }

tokio = { version = "1.53.3", features = ["fs"] }
reqwest = { version = "0.13.5", features = ["json", "multipart", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "fast-rng"] }
log = { version = "0.4.34" }
thiserror = { version = "2.0.21" }
dashmap = { version = "6.2.1", features = ["inline"] }
