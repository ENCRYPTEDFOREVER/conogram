[package]
name = "conogram"
description = "An async wrapper for Telegram Bot API"
version = "0.2.30"
edition = "2024"
license = "MIT"
homepage = "https://github.com/ENCRYPTEDFOREVER/conogram"
repository = "https://github.com/ENCRYPTEDFOREVER/conogram"
readme = "readme.md"
categories = ["api-bindings", "asynchronous"]
keywords = ["telegram", "bot", "telegram-bot", "telegram-bot-api"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["web_app_types"]
web_app_types = ["dep:form_urlencoded", "dep:hex", "dep:hmac", "dep:serde_urlencoded"]

[dependencies]
conogram-derives = { path = "./derives", version = "0.1.2" }

tokio = { version = "1.54.1", features = ["fs"] }
reqwest = { version = "0.13.5", features = ["json", "multipart", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "fast-rng"] }
log = { version = "0.4.34" }
thiserror = { version = "2.0.21" }
dashmap = { version = "6.2.1", features = ["inline"] }
sha2 = { version = "0.11.1", default-features = false, features = ["alloc"] }

form_urlencoded = { version = "1.2.2", optional = true }
hex = { version = "0.4.3", optional = true }
hmac = { version = "0.13.0", optional = true }
serde_urlencoded = { version = "0.7.1", optional = true }
